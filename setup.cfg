# Fallback metadata for old setuptools (< 61) that cannot read PEP 621 [project]
# tables in pyproject.toml. Without this, environments such as Ubuntu 22.04's
# system pip/setuptools build the project as "UNKNOWN-0.0.0" with no packages.
# pyproject.toml remains the source of truth; keep name/version/deps in sync.
[metadata]
name = framegate
version = 0.1.0
description = A fast, generic pre-pipeline gate for vision inputs (images and video frames).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Prithvi
keywords = computer-vision, shot-detection, saliency, video, preprocessing

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.22
    opencv-python>=4.5
    pyyaml>=5.4

[options.packages.find]
where = src

[options.package_data]
framegate = py.typed

[options.extras_require]
viz =
    matplotlib>=3.5
dev =
    pytest>=7.0
    matplotlib>=3.5
    ruff
    black
    mypy
    types-PyYAML
