[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framegate"
version = "0.1.0"
description = "A fast, generic pre-pipeline gate for vision inputs (images and video frames)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prithvi" }]
keywords = ["computer-vision", "shot-detection", "saliency", "video", "preprocessing"]
dependencies = [
    "numpy>=1.22",
    "opencv-python>=4.5",
    "pyyaml>=5.4",
    # imfeat (moments + gradient structure, one pass) and framestore (shot re-ID
    # index) are prerequisites. Neither is on PyPI:
    #   pip install git+https://github.com/PCJohn/imfeat
    #   pip install git+https://github.com/PCJohn/framestore
    # Optional: fastdet, for the learned maps (models.py; a text.fdt replaces the
    # heuristic text map):
    #   pip install git+https://github.com/PCJohn/fastdet
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "ruff", "black", "mypy", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framegate = ["py.typed", "models/*.fdt", "models/README.md"]

# Quality gates. Pinned here so `ruff check .`, `black .` and `mypy .` mean the same
# thing for everyone; all three are clean on src/ and tests/.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # black owns line length

[tool.black]
target-version = ["py310"]

[tool.mypy]
# no python_version pin: numpy's stubs use the `type` statement, which mypy accepts only
# when targeting 3.12+; ruff's target-version keeps the code itself 3.10-compatible
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# fastdet is optional (models.py); when it is not installed its import is skipped. imfeat
# ships a py.typed marker from its lint-pass commit on; an older build is taken as untyped.
module = ["fastdet", "fastdet.*", "imfeat", "imfeat.*"]
ignore_missing_imports = true
